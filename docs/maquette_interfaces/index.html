<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREOS — interfaces</title>
<style>
:root{--ink:#29262e;--paper:#eee4cd;--muted:#c5b89c;--wine:#793b49;--gold:#c6a66c;--teal:#63c8be;--slate:#505e75}*{box-sizing:border-box}body{margin:0;background:#19181e;color:var(--paper);font:16px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}.app{max-width:1120px;margin:auto;padding:24px 24px 110px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{font:800 28px Georgia,serif;letter-spacing:3px}.tag{font-size:12px;color:var(--muted)}.wallet{display:flex;gap:10px;flex-wrap:wrap}.chip{background:#333039;border:1px solid #655746;border-radius:10px;padding:9px 13px;font-size:14px}.panel{background:var(--paper);color:var(--ink);border:3px solid var(--ink);outline:1px solid var(--gold);border-radius:16px;padding:24px;box-shadow:0 8px 0 #0e0e13}.dark{background:#34323c;color:var(--paper)}h1,h2,h3{font-family:Georgia,serif;margin:0 0 14px}h1{font-size:32px}h2{font-size:23px}p{line-height:1.5}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.heroes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.btn{border:2px solid var(--ink);border-radius:10px;min-height:48px;padding:11px 18px;background:var(--wine);color:var(--paper);font-weight:700;box-shadow:0 3px 0 #211a23}.btn.secondary{background:#d3c4a6;color:var(--ink)}.btn.teal{background:var(--teal);color:var(--ink)}.btn:disabled{opacity:.5;cursor:default}.hero{position:relative;border:3px solid var(--ink);background:#34323c;border-radius:14px;padding:12px;text-align:left;width:100%}.hero img{width:100%;height:190px;object-fit:contain}.hero .name{font-size:19px;font-family:Georgia,serif;font-weight:bold}.stars{color:var(--gold);letter-spacing:3px;font-size:20px}.rarity{position:absolute;top:12px;right:12px;padding:4px 8px;background:var(--wine);border-radius:6px;font-size:12px}.role{color:var(--teal);font-size:13px}.bar{height:10px;background:#b6aa93;border-radius:12px;margin:10px 0;overflow:hidden}.bar>span{display:block;height:100%;background:var(--teal)}.small{font-size:13px;color:#686050}.dark .small{color:var(--muted)}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.tabs button{min-height:44px;padding:8px 14px;border:1px solid #726552;background:#34323c;border-radius:8px}.tabs button.active{background:var(--paper);color:var(--ink)}nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#24222c;border-top:2px solid #756045;display:flex;justify-content:center;gap:8px;padding:12px}nav button{background:transparent;border:0;border-radius:8px;padding:12px 18px;min-height:48px;color:var(--muted)}nav button.active{background:var(--wine);color:var(--paper)}.hub{position:relative;min-height:410px;overflow:hidden;background:#202834}.hub img{width:100%;max-height:470px;object-fit:contain}.hub-caption{position:absolute;bottom:15px;left:15px;background:#24222de8;padding:14px;border-radius:10px}.portrait{width:100%;height:410px;object-fit:contain}.stat{display:flex;justify-content:space-between;border-bottom:1px solid #c6b99d;padding:12px 0}.skill{padding:16px 0;border-bottom:1px solid #c6b99d}.skill b{display:block;margin-bottom:6px}.badge{background:#d8c8a9;padding:5px 8px;border-radius:5px;font-size:12px}.notice{padding:12px 16px;background:#34323c;border-left:3px solid var(--teal);color:var(--muted);font-size:13px;margin-bottom:20px}.quest{margin-bottom:16px}.modal{position:fixed;inset:0;background:#111b;display:grid;place-items:center;z-index:10;padding:20px}.modal .panel{max-width:440px;width:100%}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:14px 22px;border-radius:10px;z-index:20;border:2px solid var(--ink)}.section{display:none}.section.show{display:block}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters .btn{min-height:44px}.head-back{margin-bottom:18px}.equipment{padding:18px;background:#dfd1b5;border:2px dashed #9c8a68;border-radius:12px;margin-bottom:12px}footer{margin-top:24px;color:var(--muted);font-size:12px}.preview-title{color:var(--muted);font-size:12px;margin-bottom:16px}input{padding:12px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:8px;min-height:44px} @media(max-width:700px){.app{padding:16px 14px 100px}.grid{grid-template-columns:1fr}.heroes{grid-template-columns:repeat(2,minmax(0,1fr))}.hero img{height:170px}.brand{font-size:22px}header{align-items:flex-start}.wallet{gap:5px}.chip{padding:6px;font-size:12px}nav{gap:0;padding:8px 3px}nav button{font-size:12px;padding:10px 9px}.portrait{height:320px}.panel{padding:18px}.hub{min-height:300px}h1{font-size:27px}}
</style>
<body><main class="app"><div class="preview-title">MAQUETTE INTERACTIVE · données de démonstration · progression conservée pendant cette session</div><header><div><div class="brand">CREOS</div><div class="tag">Les chasseurs de Port-Franc</div></div><div class="wallet"><span class="chip" id="gold"></span><span class="chip">◆ 240 éclats</span><span class="chip">Énergie 48 / 60</span></div></header><div id="content"></div><footer>Direction : ivoire, bordeaux, ardoise, laiton et magie turquoise. Décors 3D · personnages illustrés en 2D.</footer></main><nav id="nav"></nav><div id="overlay"></div><script>
const heroes=[{id:'orage',name:'Orage',role:'Soigneur · Éclairs',rarity:'Épique',stars:3,lv:18,power:1240},{id:'corbin',name:'Corbin',role:'Assassin · Ombre',rarity:'Épique',stars:3,lv:21,power:1480},{id:'aegis',name:'Aegis',role:'Gardien · Lumière',rarity:'Rare',stars:2,lv:19,power:1350},{id:'brume',name:'Brume',role:'Mage · Eau',rarity:'Épique',stars:3,lv:17,power:1170}];let gold=12450,page='hub',selected='orage',filter='Tous',tab='Aptitudes',claimed=false;const C=document.querySelector('#content');const navs=[['hub','Port-Franc'],['heroes','Héros'],['quests','Quêtes'],['bag','Inventaire'],['profile','Profil']];
function toast(s){const el=document.createElement('div');el.className='toast';el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),2600)}function money(){document.querySelector('#gold').textContent='● '+gold.toLocaleString('fr-FR')+' or'}function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}function go(p){page=p;render();window.scrollTo(0,0)}function detail(id){selected=id;page='detail';tab='Aptitudes';render();window.scrollTo(0,0)}function modal(title,text,action,label='Confirmer'){document.querySelector('#overlay').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="panel"><h2>${title}</h2><p>${text}</p><div class="row"><button class="btn" id="confirm">${label}</button><button class="btn secondary" id="cancel">Annuler</button></div></div></div>`;document.querySelector('#confirm').onclick=()=>{document.querySelector('#overlay').innerHTML='';action()};document.querySelector('#cancel').onclick=()=>document.querySelector('#overlay').innerHTML='';document.querySelector('#cancel').focus()}
function render(){money();document.querySelector('#nav').innerHTML=navs.map(([p,n])=>`<button class="${page===p||(page==='detail'&&p==='heroes')?'active':''}" onclick="go('${p}')">${n}</button>`).join('');if(page==='hub'){C.innerHTML=`<div class="row between"><h1>Bienvenue à Port-Franc</h1><button class="btn secondary" onclick="go('profile')">Hugo · Niv. 12</button></div><div class="grid"><div class="panel dark hub"><img src="assets/hub.png" alt="Décor 3D de Port-Franc"><div class="hub-caption"><b>La place des chasseurs</b><div class="small">Loge, reliques et lanterne des serments</div></div></div><div><div class="panel"><h2>Votre prochaine chasse</h2><span class="badge">Chapitre 2 · La brume arrive</span><p>Enquêter sur les disparitions du vieux quai.</p><div class="row"><button class="btn" onclick="go('quests')">Voir la chasse</button><button class="btn secondary" onclick="go('team')">Mon équipe</button></div></div><div class="panel dark" style="margin-top:20px"><h2>Lanterne des serments</h2><p>Une nouvelle silhouette attend votre appel.</p><button class="btn teal" onclick="go('summon')">Ouvrir les invocations</button></div></div></div><div class="tabs"><button onclick="go('shop')">Marchand de masques</button><button onclick="toast('Courrier : aucun nouveau message')">Courrier</button><button onclick="go('settings')">Paramètres</button></div>`}
else if(page==='heroes'){C.innerHTML=`<div class="row between"><h1>Vos héros</h1><span>4 / 4 découverts</span></div><div class="tabs">${['Tous','Soigneur','Gardien','Assassin','Mage'].map(f=>`<button class="${f===filter?'active':''}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div><div class="heroes">${heroes.filter(h=>filter==='Tous'||h.role.startsWith(filter)).map(h=>`<button class="hero" onclick="detail('${h.id}')"><span class="rarity">${h.rarity}</span><img src="assets/${h.id}.png" alt="${h.name}"><div class="name">${h.name}</div><div class="role">${h.role}</div><div class="stars" aria-label="${h.stars} étoiles sur 5">${stars(h.stars)}</div><div class="row between"><span>Niv. ${h.lv}</span><span>Force ${h.power}</span></div></button>`).join('')}</div>`}
else if(page==='detail'){const h=heroes.find(h=>h.id===selected);C.innerHTML=`<button class="btn secondary head-back" onclick="go('heroes')">← Collection</button><div class="grid"><div class="panel dark"><div class="row between"><h1>${h.name}</h1><span class="badge" style="color:var(--ink)">${h.rarity}</span></div><div class="role">${h.role}</div><img class="portrait" src="assets/${h.id}.png" alt="${h.name}"><div class="stars">${stars(h.stars)}</div><div class="row between"><b>Niveau ${h.lv} / 40</b><span>Force ${h.power}</span></div><div class="bar"><span style="width:62%"></span></div><div class="small">Expérience 620 / 1 000 · valeurs de démonstration</div></div><div><div class="panel"><h2>Statistiques</h2>${[['Vie','2 840'],['Attaque','315'],['Défense','220'],['Vitesse','104'],['Bonus de soin','+18 %']].map(([a,b])=>`<div class="stat"><span>${a}</span><b>${b}</b></div>`).join('')}<div class="row" style="margin-top:18px"><button class="btn" onclick="level()">Améliorer · 500 or</button><button class="btn secondary" onclick="evolve()">Évolution</button></div></div><div class="tabs">${['Aptitudes','Équipement','Étoiles'].map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}</div><div class="panel">${tab==='Aptitudes'?(h.id==='orage'?`<div class="skill"><b>Paumes fulgurantes · Niv. 1</b>Trois frappes. Chaque impact accumule une charge de Souffle.</div><div class="skill"><b>Souffle réparateur · Niv. 1</b>Soigne toute l’équipe et consomme les charges pour renforcer le soin.</div><div class="skill"><b>Mantra de l’orage · Niv. 1</b>Cinq frappes rapides, puis un soin collectif.</div>`:`<p>Les trois techniques de ${h.name} seront renseignées après validation du gameplay.</p>`):tab==='Équipement'?`<div class="equipment">Arme / focus · emplacement libre</div><div class="equipment">Protection · emplacement libre</div><div class="equipment">Relique · emplacement libre</div>`:`<h2>Évolution ${h.stars} → ${h.stars+1} étoiles</h2><p>Fragments : 12 / 40</p><div class="bar"><span style="width:30%"></span></div><p class="small">Les étoiles représentent l’évolution. La rareté reste une information distincte.</p><button class="btn" disabled>Fragments insuffisants</button>`}</div></div></div>`}
else if(page==='quests'){C.innerHTML=`<h1>Quêtes et chasses</h1><div class="tabs"><button class="active">En cours</button><button onclick="toast('Aucune chasse terminée dans cette démo')">Terminées</button></div><div class="panel quest"><span class="badge">Histoire · Chapitre 2</span><h2 style="margin-top:14px">Le silence du vieux quai</h2><p>Vaincre les serviteurs de Brumenoire : 3 / 5.</p><div class="bar"><span style="width:60%"></span></div><div class="small">Récompenses : 800 or · 120 expérience</div><button class="btn" style="margin-top:16px" onclick="toast('Destination : vieux quai. Combat non connecté dans la maquette.')">Suivre la chasse</button></div><div class="panel quest"><span class="badge">Quotidienne · Terminée</span><h2 style="margin-top:14px">Rassembler les chasseurs</h2><p>Former une équipe de quatre héros.</p><button class="btn teal" ${claimed?'disabled':''} onclick="claim()">${claimed?'Récompense récupérée':'Récupérer · 300 or'}</button></div>`}
else if(page==='profile'){C.innerHTML=`<h1>Profil du chasseur</h1><div class="grid"><div class="panel"><h2>Hugo</h2><span class="badge">Chasseur de Port-Franc</span><p>Niveau du compte : 12</p><div class="bar"><span style="width:48%"></span></div><div class="small">480 / 1 000 expérience</div><p>Identifiant : CREOS-DEMO</p><button class="btn secondary" onclick="toast('Modification du profil prévue dans le jeu')">Modifier le profil</button></div><div class="panel"><h2>Votre parcours</h2><div class="stat"><span>Héros découverts</span><b>4</b></div><div class="stat"><span>Chasses accomplies</span><b>18</b></div><div class="stat"><span>Chapitre atteint</span><b>2</b></div><div class="stat"><span>Force de l’équipe</span><b>${heroes.reduce((s,h)=>s+h.power,0)}</b></div></div></div>`}
else if(page==='team'){C.innerHTML=`<h1>Formation d’équipe</h1><div class="notice">Formation proposée : Aegis en première ligne ; Corbin, Brume et Orage en soutien. Placement illustratif.</div><div class="heroes">${[heroes[2],heroes[1],heroes[3],heroes[0]].map((h,i)=>`<button class="hero" onclick="detail('${h.id}')"><div>${i===0?'Première ligne':'Soutien'}</div><img src="assets/${h.id}.png" alt="${h.name}"><b>${h.name}</b><div class="role">${h.role}</div></button>`).join('')}</div><button class="btn" style="margin-top:20px" onclick="toast('Formation conservée dans cette maquette')">Valider l’équipe</button>`}
else if(page==='bag'){C.innerHTML=`<h1>Inventaire</h1><div class="grid">${[['Fragments d’Orage','12 / 40','Évolution du moine'],['Essence de relique','8','Amélioration de reliques'],['Potion d’expérience','14','Progression des héros'],['Sceau de chasse','3','Accès aux chasses spéciales']].map(([n,v,d])=>`<div class="panel"><h2>${n}</h2><b>${v}</b><p>${d}</p><button class="btn secondary" onclick="toast('Objet de démonstration : aucune consommation')">Détails</button></div>`).join('')}</div>`}
else if(page==='summon'){C.innerHTML=`<h1>Lanterne des serments</h1><div class="panel dark"><h2>Un appel à travers la brume</h2><p>Chaque contrat révèle un chasseur. Les coûts et probabilités restent à définir pour le jeu.</p><div class="row"><button class="btn teal" onclick="toast('Animation d’invocation à créer ; aucun éclat consommé')">Prévisualiser un appel</button><button class="btn secondary" onclick="toast('Probabilités et garanties à définir avant publication')">Probabilités et garanties</button></div></div>`}
else if(page==='shop'){C.innerHTML=`<h1>Marchand de masques</h1><div class="notice">Le marchand sera illustré en 2D. Son échoppe reste un décor 3D.</div><div class="grid">${['Masque de l’Aube','Masque du Vieux Quai'].map(n=>`<div class="panel"><h2>${n}</h2><p>Apparence cosmétique · aperçu à produire</p><button class="btn secondary" onclick="toast('Achat désactivé : illustration du masque en préparation')">Voir le masque</button></div>`).join('')}</div>`}
else if(page==='settings'){C.innerHTML=`<h1>Paramètres</h1><div class="panel"><div class="stat"><label for="sound">Son</label><input id="sound" type="checkbox" checked></div><div class="stat"><label for="motion">Animations réduites</label><input id="motion" type="checkbox"></div><p>Langue : Français</p><p class="small">Préférences de maquette ; aucun réglage appliqué au jeu.</p></div>`}}
function level(){const h=heroes.find(h=>h.id===selected);if(h.lv>=40)return toast('Niveau maximum atteint');if(gold<500)return toast('Or insuffisant');modal('Améliorer '+h.name,'Passer du niveau '+h.lv+' au niveau '+(h.lv+1)+' pour 500 or ?',()=>{gold-=500;h.lv++;h.power+=35;render();toast('Niveau augmenté')},'Améliorer')}
function evolve(){tab='Étoiles';render()}function claim(){if(claimed)return;claimed=true;gold+=300;render();toast('300 or récupérés')}render();
</script></body></html>
